<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="t">Pi-hole network diagram</title>
  <desc id="d">Devices send DNS requests through the router to the Pi-hole. Ads and trackers are blocked; everything else passes through to the internet.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
  </defs>
  <rect width="1200" height="750" fill="#f4f4f5"/>

  <!-- devices -->
  <g font-size="26" fill="#09090b" font-weight="600">
    <rect x="70" y="150" width="230" height="86" rx="12" fill="#fff" stroke="#d4d4d8" stroke-width="2"/><text x="185" y="203" text-anchor="middle">Phone</text>
    <rect x="70" y="332" width="230" height="86" rx="12" fill="#fff" stroke="#d4d4d8" stroke-width="2"/><text x="185" y="385" text-anchor="middle">Laptop</text>
    <rect x="70" y="514" width="230" height="86" rx="12" fill="#fff" stroke="#d4d4d8" stroke-width="2"/><text x="185" y="567" text-anchor="middle">Smart TV</text>
  </g>
  <text x="185" y="112" text-anchor="middle" font-size="18" fill="#52525b" letter-spacing="2">DEVICES</text>

  <!-- router -->
  <rect x="400" y="316" width="190" height="118" rx="12" fill="#fff" stroke="#d4d4d8" stroke-width="2"/>
  <text x="495" y="385" text-anchor="middle" font-size="26" font-weight="600" fill="#09090b">Router</text>
  <text x="495" y="112" text-anchor="middle" font-size="18" fill="#52525b" letter-spacing="2">HOME NETWORK</text>

  <!-- pi-hole -->
  <rect x="690" y="296" width="250" height="158" rx="14" fill="#2563eb"/>
  <text x="815" y="364" text-anchor="middle" font-size="30" font-weight="700" fill="#fff">Pi-hole</text>
  <text x="815" y="402" text-anchor="middle" font-size="19" fill="#dbeafe">on a Raspberry Pi</text>

  <!-- internet -->
  <rect x="1030" y="316" width="130" height="118" rx="12" fill="#fff" stroke="#d4d4d8" stroke-width="2"/>
  <text x="1095" y="385" text-anchor="middle" font-size="24" font-weight="600" fill="#09090b">Internet</text>

  <!-- device -> router -->
  <g fill="none" stroke="#52525b" stroke-width="3" marker-end="url(#a)">
    <path d="M300 193 H350 Q380 193 380 223 V340 Q380 375 400 375"/>
    <path d="M300 375 H398"/>
    <path d="M300 557 H350 Q380 557 380 527 V410 Q380 375 400 375"/>
  </g>
  <!-- router <-> pi-hole -->
  <path d="M590 375 H688" fill="none" stroke="#52525b" stroke-width="3" marker-end="url(#a)"/>
  <text x="640" y="350" text-anchor="middle" font-size="17" fill="#52525b">DNS</text>
  <!-- pi-hole -> internet: allowed -->
  <path d="M940 375 H1028" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#b)"/>
  <text x="984" y="350" text-anchor="middle" font-size="17" fill="#2563eb" font-weight="600">allowed</text>

  <!-- blocked -->
  <path d="M815 296 V196" fill="none" stroke="#b91c1c" stroke-width="3" marker-end="url(#a)" style="marker-end:none"/>
  <path d="M815 296 V210" fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="8 8"/>
  <rect x="680" y="108" width="270" height="96" rx="12" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
  <text x="815" y="148" text-anchor="middle" font-size="22" font-weight="600" fill="#09090b">Ads &amp; trackers</text>
  <text x="815" y="180" text-anchor="middle" font-size="19" font-weight="700" fill="#b91c1c">BLOCKED</text>
  <g stroke="#b91c1c" stroke-width="4" stroke-linecap="round"><path d="M797 244l36 36M833 244l-36 36"/></g>

  <text x="600" y="690" text-anchor="middle" font-size="22" fill="#52525b">No software on any device. Blocking happens once, at the network.</text>
</svg>
